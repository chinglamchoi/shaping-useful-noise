[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-distribution-audit"
version = "0.1.0"
description = "Energy-level distribution audits for synthetic visual pretraining data"
requires-python = ">=3.10"
dependencies = [
  "adjustText",
  "einops",
  "matplotlib",
  "numpy",
  "pandas",
  "pillow",
  "scikit-learn",
  "scipy",
  "tabulate",
  "tqdm",
]

[project.optional-dependencies]
metrics = ["lpips"]
modern-data = [
  "accelerate",
  "datasets",
  "diffusers",
  "huggingface_hub",
  "pytorch-pretrained-biggan",
  "safetensors",
  "transformers",
]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["density_audit*"]
